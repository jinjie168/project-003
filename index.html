<script>
(function(){
'use strict';

/* =====================================================================
   ROCKET RUSH
   Sections: utils · save · skins · audio · state · background · spawner ·
             update · render · ui
   ===================================================================== */

/* ---------- utils ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const fmt = n => Number(n).toLocaleString('en-US');
const W = 400, PI2 = Math.PI*2, INK = '#150f3a';

const _mc = {};
function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function mix(a,b,t){
  const k=a+b+t; if(_mc[k]) return _mc[k];
  const pa=hexRgb(a), pb=hexRgb(b);
  return _mc[k]=`rgb(${Math.round(lerp(pa[0],pb[0],t))},${Math.round(lerp(pa[1],pb[1],t))},${Math.round(lerp(pa[2],pb[2],t))})`;
}

/* ---------- save data ---------- */
const SAVE_KEY = 'rocketRush.save.v1';
const save = {best:0,totalStars:0,coins:null,unlocked:['classic'],selected:'classic',music:true,sfx:true,runs:0};
try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&typeof s==='object') Object.assign(save,s); }catch(e){}
if(!Array.isArray(save.days)) save.days=[];   /* distinct calendar days played */
if(typeof save.coins!=='number') save.coins=save.totalStars||0;   /* coins = spendable balance (old star total carries over) */
if(!Array.isArray(save.unlocked)||!save.unlocked.includes('classic')) save.unlocked=['classic'].concat(Array.isArray(save.unlocked)?save.unlocked:[]);
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){} }

/* ---------- rocket skins (add more here) ---------- */
const SKINS = [
 {id:'classic',name:'Red Rocket',theme:'Classic',body:'#f6f8ff',accent:'#ff4757',fin:'#ff4757',window:'#7fe3ff',flame:['#ff7a18','#ffd23f','#fff8d6'],style:'classic',trail:'puff',decal:'stripes',req:{type:'free'}},
 {id:'comet',name:'Blue Comet',theme:'Ice Blue',body:'#eaf4ff',accent:'#2d7dff',fin:'#1f5fe0',window:'#b6f3ff',flame:['#1fb6ff','#7ef0ff','#ffffff'],style:'classic',trail:'puff',decal:'bolt',req:{type:'coins',n:100}},
 {id:'mint',name:'Mint Rover',theme:'Bubble Jets',body:'#ecfff5',accent:'#1fcf8f',fin:'#16a870',window:'#ffffff',flame:['#2ee66b','#b6ff5a','#f4ffd0'],style:'twin',trail:'ring',decal:'dots',req:{type:'coins',n:250}},
 {id:'solar',name:'Solar Flare',theme:'Fire Burst',body:'#fff4d6',accent:'#ff9f1c',fin:'#e8590c',window:'#fff1a8',flame:['#ff3d00','#ffb300','#fff3b0'],style:'wide',trail:'spark',decal:'star',req:{type:'score',n:2000}},
 {id:'nova',name:'Violet Nova',theme:'Plasma',body:'#f1e9ff',accent:'#8e44ff',fin:'#6a2fd6',window:'#ffd6fb',flame:['#c026d3','#ff7bf0','#ffe6ff'],style:'plasma',trail:'spark',decal:'bolt',req:{type:'coins',n:500}},
 {id:'cosmo',name:'Candy Cosmo',theme:'Sweet Hearts',body:'#fff0f6',accent:'#ff5fa2',fin:'#ff3d8b',window:'#c9f4ff',flame:['#ff5fa2','#ffb3d1','#ffffff'],style:'twin',trail:'heart',decal:'dots',req:{type:'score',n:5000}},
 {id:'shadow',name:'Shadow Ops',theme:'Stealth',body:'#6a7292',accent:'#00cfe8',fin:'#2a2e4a',window:'#ff6b8b',flame:['#00b8ff','#7a5cff','#ffffff'],style:'plasma',trail:'puff',decal:'stripes',req:{type:'coins',n:1000}},
 {id:'golden',name:'Golden Legend',theme:'Rainbow Jets',body:'#fff3b0',accent:'#f5b700',fin:'#d98e00',window:'#ffffff',flame:['#ff3d00','#ffd23f','#ffffff'],style:'wide',trail:'spark',decal:'star',rainbow:true,req:{type:'score',n:10000}},
 {id:'ember',name:'Ember Dragon',theme:'Dragon Fire',body:'#ffe7d6',accent:'#d9381e',fin:'#8f1d0e',window:'#ffd36b',flame:['#ff2d00','#ff8a00','#ffe28a'],style:'wide',trail:'spark',decal:'bolt',req:{type:'coins',n:1500}},
 {id:'aqua',name:'Deep Sea',theme:'Bubble Reef',body:'#e3fbff',accent:'#0aa5b8',fin:'#067a8c',window:'#fff0a8',flame:['#00e5ff','#7dffea','#ffffff'],style:'twin',trail:'ring',decal:'dots',req:{type:'days',n:3}},
 {id:'lime',name:'Lime Pop',theme:'Slime Jets',body:'#f4ffd9',accent:'#8bd10f',fin:'#5aa100',window:'#ffffff',flame:['#9dff00','#e6ff6b','#ffffff'],style:'classic',trail:'puff',decal:'stripes',req:{type:'days',n:5}},
 {id:'sakura',name:'Sakura Mochi',theme:'Petal Storm',body:'#fff5f8',accent:'#ff8fb8',fin:'#f06292',window:'#e9f7ff',flame:['#ff8fb8','#ffd1e3','#ffffff'],style:'twin',trail:'heart',decal:'star',req:{type:'days',n:7}},
 {id:'galaxy',name:'Galaxy Phantom',theme:'Starlight',body:'#3a3978',accent:'#7a5cff',fin:'#4b3bb0',window:'#7fe3ff',flame:['#7a5cff','#ff7bf0','#ffffff'],style:'plasma',trail:'spark',decal:'star',req:{type:'days',n:10}},
 {id:'prism',name:'Prism King',theme:'Rainbow Aura',body:'#ffffff',accent:'#ff4fd8',fin:'#4f8bff',window:'#ffffff',flame:['#ff3d00','#ffd23f','#ffffff'],style:'wide',trail:'spark',decal:'stripes',rainbow:true,req:{type:'days',n:14}}
];
const STATS={classic:[1,1],comet:[.94,1.04],mint:[1,1.12],solar:[.92,1.08],nova:[.9,1.14],cosmo:[.95,1.18],shadow:[.86,1.12],golden:[.82,1.22],ember:[.9,1.16],aqua:[.9,1.1],lime:[.95,1.1],sakura:[.88,1.18],galaxy:[.85,1.2],prism:[.8,1.25]};   /* [size, steer speed] */
SKINS.forEach(k=>{ const t=STATS[k.id]||[1,1]; k.size=t[0]; k.spd=t[1]; });
const skinById = id => SKINS.find(s=>s.id===id) || SKINS[0];
function reqMet(s){ const r=s.req; if(r.type==='free') return true; if(r.type==='coins') return false; /* coin rockets must be bought */ if(r.type==='days') return save.days.length>=r.n; return save.best>=r.n; }
function isUnlocked(s){ return save.unlocked.includes(s.id); }
function checkUnlocks(){ const n=[]; for(const s of SKINS){ if(!isUnlocked(s)&&reqMet(s)){ save.unlocked.push(s.id); n.push(s);} } return n; }
checkUnlocks();
if(!isUnlocked(skinById(save.selected))) save.selected='classic';
persist();

/* ---------- themes (scenes) ---------- */
const THEMES = [
 {top:'#070a33',mid:'#161263',bot:'#3a1976',neb:[[120,70,255,.34],[255,80,180,.22],[40,160,255,.22]]},
 {top:'#041230',mid:'#0a2d6b',bot:'#231b8f',neb:[[40,190,255,.28],[150,80,255,.26],[40,100,255,.26]]},
 {top:'#180632',mid:'#451259',bot:'#862a6a',neb:[[255,90,190,.3],[255,150,80,.2],[150,80,255,.28]]}
];

/* =====================================================================
   AUDIO (all synthesised with WebAudio)
   ===================================================================== */
const Snd = (function(){
  let ac=null,master,sfxG,musG,musF,send,noiseBuf;
  let engSrc=null,engGain,engFilt,engOsc;
  let timer=null,nextT=0,step=0,intensity=0,musLevel=.5,muffled=false;
  const EIGHTH = 60/104/2;
  const CH=[[57,60,64,67],[53,57,60,64],[60,64,67,71],[55,59,62,67]];
  const ROOT=[45,41,48,43];
  const mf = m => 440*Math.pow(2,(m-69)/12);

  function init(){
    if(ac){ if(ac.state==='suspended') ac.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{ ac=new AC(); }catch(e){ ac=null; return; }
    master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
    sfxG=ac.createGain(); sfxG.connect(master);
    musG=ac.createGain(); musF=ac.createBiquadFilter(); musF.type='lowpass'; musF.frequency.value=3200;

    const sz=p.s*(p.shape==='wave'?1:(.3+.7*k))*(1+(p.grow&&p.shape!=='wave'?p.grow*(1-k):0));
    c.fillStyle=p.col; c.strokeStyle=p.col;
    switch(p.shape){
      case 'spark': sparkle(c,p.x,p.y,sz*1.7); break;
      case 'heart': c.save(); c.translate(p.x,p.y); c.rotate(Math.sin(p.rot)*.4); c.beginPath(); c.moveTo(0,sz*.5); c.bezierCurveTo(-sz*1.3,-sz*.2,-sz*.6,-sz*1.2,0,-sz*.45); c.bezierCurveTo(sz*.6,-sz*1.2,sz*1.3,-sz*.2,0,sz*.5); c.fill(); c.restore(); break;
      case 'ring': c.lineWidth=1.6; c.beginPath(); c.arc(p.x,p.y,sz,0,PI2); c.stroke(); break;
      case 'wave': c.lineWidth=Math.max(.5,p.lw*k); c.beginPath(); c.arc(p.x,p.y,p.s*(1+p.grow*(1-k)),0,PI2); c.stroke(); break;

      default: c.beginPath(); c.arc(p.x,p.y,sz,0,PI2); c.fill();
    }
  }
  c.globalAlpha=1; c.globalCompositeOperation='source-over';
}
function floatText(x,y,text,col,size){ floats.push({x:x,y:y,t:text,col:col||'#fff',size:size||20,life:1.1,max:1.1}); }
function updateFloats(dt){ for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.life-=dt; f.y-=48*dt; if(f.life<=0) floats.splice(i,1); } }

/* =====================================================================
   SPAWNER  (always leaves a reachable safe corridor)
   ---------------------------------------------------------------------
   Every wave picks a corridor centre `sx` (never farther from the last
   one than the rocket can travel in the time between waves). Obstacles
   are only placed outside that corridor. Fast objects use an
   "arrival-time" model so they reach the rocket row at the same moment
   as the rest of their wave, keeping the corridor valid.
   ===================================================================== */
const rocketPlayY = () => H*.74;
function placeObj(o,ny){ const RY=rocketPlayY(); o.ny=ny; o.y=RY-(RY-ny)*o.sp; obs.push(o); }
function fits(w,o,ny){
  for(const p of w.placed){
    if(o.sp>1.3||p.sp>1.3){ if(Math.abs(o.x-p.x)<o.r+p.r+10) return false; }
    else if(Math.hypot(o.x-p.x,ny-p.ny)<o.r+p.r+14) return false;
  }
  return true;
}
function scatter(w,count,factory){
  for(let i=0;i<count;i++){
    for(let tries=0;tries<12;tries++){
      const o=factory();
      o.x=rand(o.r+6,W-o.r-6);
      if(Math.abs(o.x-w.sx)<w.hw+o.r*o.hit+(o.amp||0)+8) continue;
      const ny=-(o.r+40)-rand(0,w.spread);
      if(!fits(w,o,ny)) continue;
      o.bx=o.x; w.placed.push({x:o.x,ny:ny,r:o.r,sp:o.sp}); placeObj(o,ny); break;
    }
  }
}
function rockWave(w,n){ scatter(w,n,()=>{ const sz=pick([[12,18],[19,26],[19,26],[28,37]]); return makeRock(rand(sz[0],sz[1]),false,rand(1,1.15)); }); }
function mineWave(w){ scatter(w,randInt(1,2+(w.diff>.6?1:0)),makeMine); }
function fireWave(w){ scatter(w,1+(w.diff>.45?1:0)+(Math.random()<.3?1:0),()=>makeRock(rand(15,23),true,rand(1.5,1.8))); if(Math.random()<.6) rockWave(w,1); }
function debrisWave(w){
  const leftRoom=w.sx-w.hw, rightRoom=W-(w.sx+w.hw);
  let side=leftRoom>rightRoom?-1:1; if(Math.min(leftRoom,rightRoom)>70&&Math.random()<.5) side=-side;
  const cx=side<0?clamp(leftRoom/2,28,W):clamp(w.sx+w.hw+rightRoom/2,0,W-28);
  const cny=-90-rand(0,w.spread*.6), n=Math.random()<.25?1:randInt(3,5+Math.floor(w.diff*3));
  for(let i=0;i<n;i++){
    for(let tries=0;tries<10;tries++){
      const o=makeDebris(rand(8,14)); o.x=cx+rand(-44,44); const ny=cny+rand(-40,40);
      if(o.x<o.r+4||o.x>W-o.r-4||Math.abs(o.x-w.sx)<w.hw+o.r*o.hit+8||!fits(w,o,ny)) continue;
      w.placed.push({x:o.x,ny:ny,r:o.r,sp:1}); placeObj(o,ny); break;
    }
  }
}
function gateWave(w){
  const gate={k:'gate',x:w.sx,y:0,r:0,gx1:w.sx-w.hw-6,gx2:w.sx+w.hw+6,sp:1,rot:0,rotSp:0,armed:false,warned:false};
  placeObj(gate,-30);
}
function coinHitsObs(s){ for(const o of obs){ if(o.k==='gate'){ if(Math.abs(s.y-o.y)<24&&(s.x<o.gx1||s.x>o.gx2)) return true; } else if(Math.hypot(s.x-o.x,s.y-o.y)<(o.r||18)+18) return true; } return false; }
function coinClear(x,y){

  for(const o of obs){ if(o.k==='gate'){ if(Math.abs(y-o.y)<40) return false; } else if(Math.hypot(x-o.x,y-o.y)<(o.r||18)+26) return false; }

function spawnStars(sx,hw,hasPup){
  const pat=pick(['line','zig','arc','line']), n=randInt(4,6), dir=Math.random()<.5?-1:1;
  let y=hasPup?-120:-60;
  for(let i=0;i<n;i++){
    let x=sx;
    if(pat==='zig') x=sx+(i%2?1:-1)*hw*.45;
    else if(pat==='arc') x=sx+Math.sin(i/(n-1)*Math.PI)*hw*.55*dir;

function pickPup(){
  const opts=[]; if(!G.shield) opts.push('shield','shield'); if(G.magnet<=0) opts.push('magnet'); if(G.boost<=0) opts.push('boost');

function spawnWave(){
  if(G.stage==='boss') return;   /* boss fights its own attacks */
  const eff=G.time+G.timeOffset, diff=G.diff;
  const hw=lerp(90,48,diff), spread=lerp(60,105,diff);
  const gapMin=G.gapDist*.92;
  const maxShift=clamp(.5*420*(gapMin-spread-40)/Math.max(G.baseV,150),45,170);
  let sx=G.lastSafe+(Math.random()<.5?-1:1)*rand(.35,1)*maxShift;
  if(sx<70||sx>W-70) sx=G.lastSafe-(sx-G.lastSafe);
  sx=clamp(sx,70,W-70);
  G.lastSafe=sx;
  const w={sx:sx,hw:hw,spread:spread,diff:diff,placed:[]};
  const ramp=(s,f)=>clamp((eff-s)/(f||30),0,1);
  const table=[['rocks',1.05-.45*diff],['mines',.55*ramp(18)],['debris',.7*ramp(28)],['fire',.85*ramp(42)],['laser',G.lastType==='laser'?0:.65*ramp(58)],['mixed',ramp(95,40)]];
  let total=0; for(const t of table) total+=t[1];
  let r=Math.random()*total, type='rocks';
  for(const t of table){ r-=t[1]; if(r<=0){ type=t[0]; break; } }
  if(G.stage==='shower') type='rocks'; else if(G.stage==='laser') type=(G.lastType==='laser')?'rocks':'laser';
  G.lastType=type;
  const rn=G.stage==='shower'?randInt(3,4+Math.floor(diff*2)):randInt(1,2+Math.floor(diff*3));
  switch(type){
    case 'rocks': rockWave(w,rn); break;
    case 'mines': mineWave(w); if(Math.random()<.5) rockWave(w,1); break;
    case 'debris': debrisWave(w); if(Math.random()<.4) rockWave(w,1); break;
    case 'fire': fireWave(w); break;
    case 'laser': gateWave(w); break;
    case 'mixed': rockWave(w,randInt(1,2)); fireWave(w); if(Math.random()<.6) mineWave(w); if(Math.random()<.4) debrisWave(w); break;
  }
  G.gapDist=lerp(340,258,diff)*rand(.95,1.06)*(G.stage==='shower'?.62:1);
  G.pupCd-=G.gapDist;
  let hasPup=false;
  if(G.pupCd<=0&&G.time>5){
    const k=pickPup();
    if(k){ pups.push({k:k,x:sx,y:-70,ph:rand(0,PI2)}); hasPup=true; G.pupCd=rand(2700,4300); }
  }
  if(Math.random()<.85||hasPup) spawnStars(sx,hw,hasPup);
}

function hitCircle(cx,cy,cr){

    const k=G.size||1, dx=R.x+RC[i][0]*k-cx, dy=R.y+RC[i][1]*k-cy, rr=RC[i][2]*k+cr;

  }
  return false;
}
function nearGap(cx,cy,cr){ let m=1e9; const k=G.size||1; for(let i=0;i<3;i++){ m=Math.min(m,Math.hypot(R.x+RC[i][0]*k-cx,R.y+RC[i][1]*k-cy)-RC[i][2]*k-cr); } return m; }

function updateObjects(dt){
  const v=G.v, live=(G.state==='playing'&&R.alive);

    const o=obs[i];
    o.y+=v*o.sp*dt; o.rot+=o.rotSp*dt;
    if(o.k==='mine') o.x=o.bx+Math.sin(G.clock*o.sf+o.ph)*o.amp;
    else if(o.k==='gate'){
      if(!o.warned&&o.y>-10){ o.warned=true; Snd.laserWarn(); }
      if(!o.armed&&o.y>H*.17){ o.armed=true; Snd.laserOn(); }
      if(o.armed&&Math.random()<dt*10){ const px=Math.random()<.5?o.gx1:o.gx2; burst(px,o.y,3,['#ff7a9a','#ffffff'],110,2.5,.35,{add:true,shape:'spark',scroll:.6}); }
    } else if(o.k==='fire'&&o.y>-20&&o.y<H&&Math.random()<dt*40){
      addP({x:o.x+rand(-o.r,o.r)*.6,y:o.y-o.r*.4,vx:rand(-20,20),vy:rand(-60,-20)+v*.3,life:rand(.3,.6),s:rand(2,4),col:pick(['#ff9f1c','#ffd23f','#ff4d12']),shape:'c',add:true,drag:1,scroll:0,grow:0,rot:0,vr:0,g:0});
    }

    if(live){

      else if(hitCircle(o.x,o.y,o.r*o.hit)) handleHit(o,i);
      else if(!o.nm&&o.y>R.y-15&&nearGap(o.x,o.y,o.r*o.hit)<12){ o.nm=true; nearMiss(o); }
      if(G.state!=='playing') return;
    }
  }
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i]; s.y+=v*dt;
    if(s.y>-20&&coinHitsObs(s)){ stars.splice(i,1); continue; }   /* coins never sit on obstacles */
    if(live&&G.magnet>0){
      const dx=R.x-s.x, dy=R.y-s.y, d=Math.hypot(dx,dy);
      if(d<175&&d>1){ const sp=(520+(175-d)*4)*dt; s.x+=dx/d*sp; s.y+=dy/d*sp; }
    }
    if(live&&hitCircle(s.x,s.y,13)){ collectStar(s); stars.splice(i,1); continue; }
    if(!s.missed&&s.y>R.y+45){ s.missed=true; if(live&&G.combo>0) setCombo(0); }

  if(G.deadT>1.15) finishRun();
}
function updateIdle(dt){
  updateBg(dt,70);
  const ms=H<650?1.55:2.05;
  R.y+=((H*.43+Math.sin(G.clock*2)*6)-R.y)*Math.min(1,4*dt);
  R.scale+=(ms-R.scale)*Math.min(1,4*dt);
  R.x+=(W/2-R.x)*Math.min(1,4*dt); R.tx=R.x;
  R.tilt+=(Math.sin(G.clock*1.2)*.05-R.tilt)*Math.min(1,5*dt); R.vx=0;
  if(G.state==='menu'&&!G.garage) emitExhaust(dt,55);

}

/* ---------- HUD ---------- */
const elScore=$('score'), elStars=$('hudStars'), elCombo=$('comboPill');
function updateHud(){

function hideHint(){ $('hint').classList.remove('on'); G.hintT=0; }

/* =====================================================================
   RENDER
   ===================================================================== */
function drawShield(){
  const c=ctx, t=G.clock; const x=R.x, y=R.y-3, r=33*(1+.03*Math.sin(t*6));
  c.save(); c.translate(x,y);
  if(G.invuln>0&&Math.floor(t*14)%2) c.globalAlpha=.5;
  const g=c.createRadialGradient(0,0,r*.45,0,0,r); g.addColorStop(0,'rgba(90,200,255,.05)'); g.addColorStop(.8,'rgba(90,200,255,.28)'); g.addColorStop(1,'rgba(160,235,255,.6)');
  c.fillStyle=g; c.beginPath(); c.arc(0,0,r,0,PI2); c.fill();
  c.lineWidth=3; c.strokeStyle='rgba(200,242,255,.95)'; c.stroke();
  c.strokeStyle='rgba(255,255,255,.85)'; c.lineWidth=3; c.lineCap='round'; c.beginPath(); c.arc(0,0,r*.78,Math.PI*1.15,Math.PI*1.45); c.stroke();
  c.fillStyle='#fff'; sparkle(c,Math.cos(t*2)*r*.7,Math.sin(t*2)*r*.7,3.5);
  c.restore();
}
function drawMagnetFx(){
  const c=ctx, t=G.clock; c.save(); c.translate(R.x,R.y); c.globalAlpha=.55; c.lineWidth=2.5; c.lineCap='round';
  for(let i=0;i<3;i++){
    const rr=50+((t*60+i*40)%120), a=1-(rr-50)/120;
    c.globalAlpha=.5*a; c.strokeStyle='#ff6b6b'; c.beginPath(); c.arc(0,0,rr,-Math.PI*.9,-Math.PI*.1); c.stroke();
    c.beginPath(); c.arc(0,0,rr,Math.PI*.1,Math.PI*.9); c.stroke();
  }
  c.restore();
}
function render(){
  const c=ctx;
  c.setTransform(dpr*S,0,0,dpr*S,0,0);
  drawBackground();
  c.save();
  if(G.shake>.2) c.translate(rand(-1,1)*G.shake,rand(-1,1)*G.shake);
  for(const o of obs){
    if(o.y<-120&&o.k!=='gate') continue;
    if(o.k==='rock'||o.k==='fire') drawRock(o);
    else if(o.k==='debris') drawDebris(o);
    else if(o.k==='mine') drawMine(o);
    else if(o.k==='gate') drawGate(o);
  }
  for(const s of stars) if(s.y>-30) drawStarItem(s);
  if(G.boss) drawBoss(c);
  for(const p of pups) if(p.y>-60) drawPup(p);
  drawParts();
  if(R.alive&&!G.garage){
    const skin=skinById(save.selected);
    if(G.state==='playing'||G.state==='paused'){
      if(G.boost>0){ c.save(); c.globalCompositeOperation='lighter'; const g=c.createRadialGradient(R.x,R.y,10,R.x,R.y,70); g.addColorStop(0,'rgba(255,220,90,.55)'); g.addColorStop(1,'rgba(255,160,40,0)'); c.fillStyle=g; c.beginPath(); c.arc(R.x,R.y,70,0,PI2); c.fill(); c.restore(); }
      if(G.magnet>0) drawMagnetFx();
    }
    const blink=G.state==='playing'&&G.invuln>0&&G.boost<=0&&!G.shield&&Math.floor(G.clock*14)%2;
    if(blink) c.globalAlpha=.45;
    const fl=.8+(G.boost>0?.8:0)+clamp(Math.abs(R.vx)/700,0,.3)+(G.state==='menu'?.1:0);
    drawRocket(c,skin,R.x,R.y,R.scale,R.tilt,G.clock,fl);
    c.globalAlpha=1;
    if(G.shield&&G.state!=='menu') drawShield();
  }
  drawWarnings();
  drawFloats();
  c.restore();
  c.fillStyle=vigGrad; c.fillRect(0,0,W,H);
  if(G.flash>.01){ c.fillStyle=`rgba(255,255,255,${G.flash*.55})`; c.fillRect(0,0,W,H); }
  if(G.garage) drawGaragePreviews();
}

function showScreen(id){ stage.classList.remove('flip','fever','inrun'); document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('show',s.id===id)); }
function refreshToggles(){
  document.querySelectorAll('.tog-music').forEach(b=>b.classList.toggle('off',!save.music));

function refreshMenu(){ $('menuBest').textContent=fmt(save.best); $('menuStars').textContent=fmt(save.coins); }
function clearWorld(){ obs.length=0; stars.length=0; pups.length=0; parts.length=0; floats.length=0; }
function resetRun(){
  clearWorld();
  Object.assign(G,{time:0,diff:0,v:190,baseV:190,speedMul:1,score:0,dist:0,stars:0,combo:0,comboT:0,shield:false,magnet:0,boost:0,invuln:0,
    waveDist:340-230,gapDist:340,lastSafe:W/2,lastType:'',pupCd:1500,boss:null,fe:0,fever:0,feT:0,recW:false,recH:false,cd:null,slow:0,stageN:0,stage:'normal',flip:false,nmCount:0,shake:0,flash:0,deadT:0,newBest:false,exAcc:0,shownScore:-1,shownStars:-1,shownCombo:-1});
}
function startRun(fromRestart){
  { const d=new Date().toLocaleDateString('sv-SE'); if(!save.days.includes(d)){ save.days.push(d); persist(); } }
  Snd.init();
  resetRun();
  const prev=theme; do{ theme=pick(THEMES); }while(theme===prev&&THEMES.length>1);
  buildBackground();
  R.alive=true; R.tilt=0;
  if(fromRestart){ R.x=W/2; R.y=H+50; R.scale=1; }
  R.tx=R.x;
  G.state='playing'; G.garage=false;
  showScreen(null); $('hud').classList.add('show');
  elCombo.classList.remove('on'); updateHud(); showHint();

}
function goHome(){

function pause(){
  if(G.state!=='playing'||G.cd) return;

  Snd.engineStop(); Snd.pause(); Snd.musicLevel(.18,true);
}
function resume(){

  G.state='playing'; showScreen(null); drag=null;
  Snd.musicLevel(.42,false); G.cd={t:0,resume:true,last:4};
}
function countUp(el,to,dur){
  const t0=performance.now();
  (function step(n){ const k=clamp((n-t0)/dur,0,1); el.textContent=fmt(Math.floor(to*(1-Math.pow(1-k,3)))); if(k<1) requestAnimationFrame(step); })(t0);
}
function finishRun(){
  G.state='over';
  const sc=Math.floor(G.score);
  G.newBest=sc>save.best;
  if(G.newBest) save.best=sc;
  save.totalStars+=G.stars; save.coins+=G.stars; save.runs=(save.runs||0)+1;
  const unlocked=checkUnlocks(); persist();
  $('hud').classList.remove('show');
  countUp($('ovScore'),sc,900);
  $('ovNew').classList.toggle('on',G.newBest);
  $('ovBest').textContent=fmt(save.best);
  $('ovStars').textContent='+'+G.stars;
  $('ovDist').textContent=fmt(Math.floor(G.dist/10))+' m';
  const ub=$('unlockBox');
  if(unlocked.length){
    ub.innerHTML='<canvas width="68" height="88"></canvas><div>NEW ROCKET UNLOCKED!<br>'+unlocked.map(s=>s.name).join(', ')+'</div>';
    ub.classList.add('on');
    const cv=ub.querySelector('canvas'), cc=cv.getContext('2d'); cc.setTransform(2,0,0,2,0,0);
    drawRocket(cc,unlocked[0],17,26,.95,0,0,.8);
    setTimeout(Snd.unlock,1000);
  } else ub.classList.remove('on');
  showScreen('over'); Snd.over(); Snd.musicLevel(.3,false);
}

/* ---------- garage : swipe carousel ---------- */
const gCv=$('gCv'), gCtx=gCv.getContext('2d');
const LOCK_PATH=new Path2D('M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1zm2 0h6V7a3 3 0 0 0-6 0v3z');
let gIdx=0, gPos=0, gDrag=null, gLast=0, gw=400, gh=480;
function sizeGarage(){
  const w=gCv.clientWidth, h=gCv.clientHeight; if(!w||!h) return;
  gCv.width=Math.round(w*dpr); gCv.height=Math.round(h*dpr); gw=w/S; gh=h/S;
}
function lockedSkin(s){ return Object.assign({},s,{body:'#6a72ae',accent:'#454b86',fin:'#454b86',window:'#343868',flame:['#343873','#343873','#343873'],rainbow:false}); }
function reqText(s){
  const r=s.req;
  if(isUnlocked(s)) return save.selected===s.id ? 'EQUIPPED' : 'UNLOCKED';
  if(r.type==='coins') return 'Costs <svg class="ic"><use href="#i-coin"/></svg>'+fmt(r.n);
  if(r.type==='days') return 'Play on '+r.n+' different days ('+Math.min(save.days.length,r.n)+' / '+r.n+')';
  return 'Reach '+fmt(r.n)+' score in one run (best '+fmt(save.best)+')';
}
function rr(c,x,y,w,h,r){ c.beginPath(); if(c.roundRect) c.roundRect(x,y,w,h,r); else c.rect(x,y,w,h); }
function lockInfo(s){
  const r=s.req, cur=r.type==='coins'?save.coins:r.type==='days'?save.days.length:save.best, left=Math.max(0,r.n-cur);
  if(r.type==='coins') return {l:['Buy with',fmt(r.n)+' coins'],cur,n:r.n,t:fmt(left)+' coins to go'};
  if(r.type==='days') return {l:['Play on '+r.n,'different days'],cur,n:r.n,t:left+(left===1?' day':' days')+' to go'};
  return {l:['Reach '+fmt(r.n),'score in one run'],cur,n:r.n,t:fmt(left)+' score to go'};
}
function gLockInfo(c,sk,x,y,sc,k){
  const f=.6+.4*k, I=lockInfo(sk), INK='#0e0c3a';
  const panel=(h)=>{ const g=c.createLinearGradient(0,-h/2,0,h/2); g.addColorStop(0,'#4a49b8'); g.addColorStop(1,'#26246f'); return g; };
  c.save(); c.translate(x,y-48*sc-30*f); c.scale(f,f); c.rotate(-.03);
  rr(c,-68,-22,136,44,14); c.fillStyle=panel(44); c.fill(); c.lineWidth=3; c.strokeStyle=INK; c.stroke();
  c.fillStyle='#fff'; c.font="700 15px 'Lilita One',sans-serif"; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(I.l[0],0,-8); c.fillText(I.l[1],0,10); c.restore();
  c.save(); c.translate(x,y+27*sc+18*f); c.scale(f,f);
  rr(c,-62,-8,124,16,8); c.fillStyle='#14123f'; c.fill(); c.lineWidth=3; c.strokeStyle=INK; c.stroke();
  const fw=Math.max(10,116*clamp(I.cur/I.n,0,1)); rr(c,-58,-4.5,fw,9,4.5); const g=c.createLinearGradient(0,-5,0,5); g.addColorStop(0,'#ffe58a'); g.addColorStop(1,'#ffa91f'); c.fillStyle=g; c.fill();
  rr(c,-60,14,120,22,11); c.save(); c.translate(0,25); c.fillStyle=panel(22); c.fillRect(-60,-11,120,22); c.restore();
  rr(c,-60,14,120,22,11); c.fillStyle=panel(22); c.save(); c.translate(0,25); c.fill(); c.restore(); c.lineWidth=3; c.strokeStyle=INK; c.stroke();
  c.fillStyle='#fff'; c.font="700 12px 'Lilita One',sans-serif"; c.textAlign='center'; c.textBaseline='middle'; c.fillText(I.t,0,25.5); c.restore();
}
function gUpdateUI(){
  const s=SKINS[gIdx], un=isUnlocked(s);
  $('garageStars').textContent=fmt(save.coins);
  $('gName').textContent=s.name; $('gTheme').textContent=s.theme+'  /  Size '+Math.round(s.size*100)+'%  /  Speed '+Math.round(s.spd*100)+'%';
  const rq=$('gReq'); rq.innerHTML=un?reqText(s):''; rq.classList.toggle('ok',un);
  const btn=$('btnGSelect');
  if(un){ btn.className='btn green btn-lg'; btn.textContent='SELECT'; }
  else if(s.req.type==='coins'){
    const can=save.coins>=s.req.n;
    btn.className='btn btn-lg '+(can?'orange':'dis');
    btn.innerHTML='BUY <svg class="ic"><use href="#i-coin"/></svg>'+fmt(s.req.n);
  } else { btn.className='btn btn-lg dis'; btn.innerHTML='<svg class="ic"><use href="#i-lock"/></svg>LOCKED'; }
  $('gPrev').classList.toggle('off',gIdx===0); $('gNext').classList.toggle('off',gIdx===SKINS.length-1);
}
function gGo(i,quiet){
  i=clamp(i,0,SKINS.length-1);
  if(i!==gIdx){ gIdx=i; if(!quiet) Snd.click(); }
  gUpdateUI();
}
function gAction(){
  Snd.init();
  const s=SKINS[gIdx], btn=$('btnGSelect');
  if(isUnlocked(s)){ save.selected=s.id; persist(); Snd.click(); closeGarage(); return; }
  if(s.req.type==='coins' && save.coins>=s.req.n){
    save.coins-=s.req.n; save.unlocked.push(s.id); save.selected=s.id; persist(); Snd.unlock(); gUpdateUI(); return;
  }
  Snd.deny(); btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
}
function drawGaragePreviews(){
  const c=gCtx, t=G.clock, dt=Math.min(.05,Math.max(0,t-gLast)); gLast=t;
  if(!gDrag) gPos+=(gIdx-gPos)*Math.min(1,dt*11);
  c.setTransform(dpr*S,0,0,dpr*S,0,0); c.clearRect(0,0,gw,gh);
  const cx=gw/2, cy=gh*.54, sp=gw*.36;
  const cs=SKINS[clamp(Math.round(gPos),0,SKINS.length-1)];
  const gc=isUnlocked(cs)?cs.accent:'#5560b0', gl=c.createRadialGradient(cx,cy,10,cx,cy,Math.min(gw*.5,gh*.45)); gl.addColorStop(0,gc+'55'); gl.addColorStop(1,gc+'00');
  c.fillStyle=gl; c.fillRect(0,0,gw,gh);
  const order=SKINS.map((_,i)=>i).sort((a,b)=>Math.abs(b-gPos)-Math.abs(a-gPos));
  for(const i of order){
    const sk=SKINS[i], d=i-gPos, ad=Math.abs(d); if(ad>2.3) continue;
    const k=clamp(1-ad,0,1), sc=1.3+k*clamp(gh/320,1.1,1.8), x=cx+d*sp, un=isUnlocked(sk);
    const y=cy+(1-k)*16+Math.sin(t*2+i)*3*k;
    c.save(); c.globalAlpha=ad>1.4?clamp(1-(ad-1.4)*1.1,0,1):1;   /* opaque near the centre: no alpha seams between rocket parts */
    drawRocket(c,un?sk:lockedSkin(sk),x,y,sc,Math.sin(t*1.5+i)*.05,t+i,un?.85:0);
    if(!un) gLockInfo(c,sk,x,y,sc,k);
    if(!un){
      const ls=sc*1.25; c.translate(x,y-4*sc);
      c.fillStyle='rgba(8,6,40,.55)'; c.beginPath(); c.arc(0,0,17*ls,0,PI2); c.fill();
      c.scale(ls,ls); c.translate(-12,-12); c.fillStyle='#fff'; c.fill(LOCK_PATH);
    }
    c.restore();
  }
}
function openGarage(){
  G.garage=true; gIdx=gPos=Math.max(0,SKINS.findIndex(s=>s.id===save.selected));
  showScreen('garage'); sizeGarage(); gUpdateUI();
}
function closeGarage(){ G.garage=false; refreshMenu(); showScreen('menu'); }

/* swipe / drag on the carousel */
gCv.addEventListener('pointerdown',e=>{
  Snd.init();
  gDrag={id:e.pointerId,sx:e.clientX,sp:gPos,x0:e.clientX,t0:performance.now(),pts:[[e.clientX,performance.now()]]};
  try{ gCv.setPointerCapture(e.pointerId); }catch(_){}
});
gCv.addEventListener('pointermove',e=>{
  if(!gDrag||e.pointerId!==gDrag.id) return;
  const now=performance.now(); gDrag.pts.push([e.clientX,now]); if(gDrag.pts.length>6) gDrag.pts.shift();
  gPos=clamp(gDrag.sp-(e.clientX-gDrag.sx)/(gw*.36*S),-.35,SKINS.length-.65);
});
function gEnd(e){
  if(!gDrag||e.pointerId!==gDrag.id) return;
  const d=gDrag; gDrag=null;
  const dx=e.clientX-d.x0;
  if(Math.abs(dx)<8 && performance.now()-d.t0<400){          /* tap: tap a side rocket to bring it to the centre */
    const r=gCv.getBoundingClientRect(), rel=(e.clientX-r.left)/S-gw/2;
    gGo(gIdx+(rel>gw*.17?1:rel<-gw*.17?-1:0)); return;
  }
  const a=d.pts[0], b=d.pts[d.pts.length-1], vx=b[1]>a[1]?(b[0]-a[0])/(b[1]-a[1]):0;   /* px per ms */
  const pred=gPos-(vx*140)/(gw*.36*S);
  gGo(clamp(Math.round(pred),gIdx-1,gIdx+1));   /* one rocket per swipe */
}
['pointerup','pointercancel'].forEach(n=>gCv.addEventListener(n,gEnd));
$('gPrev').addEventListener('click',()=>gGo(gIdx-1));
$('gNext').addEventListener('click',()=>gGo(gIdx+1));
$('btnGSelect').addEventListener('click',gAction);
window.addEventListener('keydown',e=>{
  if(e.code==='Escape'&&$('settings').classList.contains('show')){ showScreen('menu'); return; }
  if(!G.garage) return;
  if(e.code==='ArrowLeft'||e.code==='KeyA') gGo(gIdx-1);
  else if(e.code==='ArrowRight'||e.code==='KeyD') gGo(gIdx+1);
  else if(e.code==='Escape') closeGarage();
  else if(e.code==='Enter'&&!(document.activeElement&&document.activeElement.tagName==='BUTTON')) gAction();
});

/* ---------- input ---------- */
let drag=null;
canvas.addEventListener('pointerdown',e=>{
  Snd.init();

canvas.addEventListener('pointermove',e=>{

  drag.lx=e.clientX; const raw=drag.tx+(G.flip?-1:1)*(e.clientX-drag.sx)/S, cl=clamp(raw,MARGIN,W-MARGIN);

/* touch: stop the browser scrolling / pull-to-refresh / zooming while swiping to steer */

window.addEventListener('pointerdown',()=>Snd.init(),true);
window.addEventListener('keydown',e=>{
  Snd.init();

  else if((k==='Enter'||k==='Space')&&!e.repeat&&!(document.activeElement&&document.activeElement.tagName==='BUTTON')){
    if(G.state==='menu'&&!G.garage&&!$('settings').classList.contains('show')) startRun(false);
    else if(G.state==='over') startRun(true);
    if(k==='Space') e.preventDefault();
  }
});
window.addEventListener('keyup',e=>{
  const k=e.code;
  if(k==='ArrowLeft'||k==='KeyA') keys.l=false;
  else if(k==='ArrowRight'||k==='KeyD') keys.r=false;
});
window.addEventListener('blur',()=>{ keys.l=keys.r=false; if(G.state==='playing') pause(); });
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ keys.l=keys.r=false; if(G.state==='playing') pause(); Snd.suspend(); }
  else Snd.resumeCtx();

document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('button'); if(b) b.blur(); });

function wire(id,fn){ $(id).addEventListener('click',()=>{ Snd.init(); Snd.click(); fn(); }); }

wire('btnGarage',openGarage);
/* tap the rocket on the home screen to open the rocket picker */
$('menu').addEventListener('click',e=>{
  if(G.garage||(e.target.closest&&e.target.closest('button,.card'))) return;
  const r=stage.getBoundingClientRect(), x=(e.clientX-r.left)/S, y=(e.clientY-r.top)/S;
  if(Math.abs(x-R.x)<R.scale*32&&y>R.y-R.scale*52&&y<R.y+R.scale*38){ Snd.init(); Snd.click(); openGarage(); }
});
wire('btnSettings',()=>{ refreshToggles(); showScreen('settings'); });
wire('btnSBack',()=>showScreen('menu'));
wire('btnGBack',closeGarage);
wire('btnPause',pause);
wire('btnResume',resume);
wire('btnPRestart',()=>startRun(true));
wire('btnPHome',goHome);
wire('btnRestart',()=>startRun(true));
wire('btnHome',goHome);
document.querySelectorAll('.tog-music').forEach(b=>b.addEventListener('click',()=>{ Snd.init(); save.music=!save.music; persist(); Snd.applyPrefs(); refreshToggles(); Snd.click(); }));
document.querySelectorAll('.tog-sfx').forEach(b=>b.addEventListener('click',()=>{ Snd.init(); save.sfx=!save.sfx; persist(); Snd.applyPrefs(); refreshToggles(); if(save.sfx) Snd.click(); }));

/* ---------- resize & main loop ---------- */
function resize(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const w=Math.floor(Math.min(vw,vh*.72));
  stage.style.width=w+'px'; stage.style.height=vh+'px';
  S=w/W; H=vh/S; dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(vh*dpr);
  stage.style.setProperty('--u',S+'px');
  buildBackground(); initBg(); sizeGarage();
  if(G.state==='menu'||G.state==='over') R.y=Math.min(R.y,H*1.02);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(!(dt>0)) dt=1/60; dt=Math.min(dt,1/30);
  G.clock+=dt;
  switch(G.state){
    case 'playing': if(G.cd) updateCountdown(dt); else updatePlaying(dt); break;
    case 'dying': updateDying(dt); break;
    case 'paused': break;
    default: updateIdle(dt);
  }
  render();
}

resize();
R.y=H*1.02; R.scale=1;
refreshMenu(); refreshToggles();
requestAnimationFrame(frame);
})();
</script>
</body>
